    <div class="movieModel" id="movieModel">
        <form id="movieForm">
            <div class="card">
                <div class="card-header d-flex  justify-content-between">
                    <h4 id="addTxt">Add Movie</h4>
                    <h4 id="updateTxt" class="d-none">Update Movie</h4>
                    <i class="fa-regular fa-circle-xmark fa-2x closeModel" role="button"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="title"> Movie Name </label>
                        <input required type="text" id="title" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="poster"> Movie Image </label>
                        <input required type="text" id="poster" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="genre"> Movie Genre </label>
                        <select required type="text" id="genre" class="form-control">
                            <option disabled selected hidden>Select Genre</option>
                            <option value="Action">Action</option>
                            <option value="Science Fiction (Sci-Fi)">Science Fiction (Sci-Fi)</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Drama">Drama</option>
                            <option value="Thriller">Thriller</option>
                            <option value="Animation">Animation</option>
                            <option value="Romance">Romance</option>
                            <option value="Romantic Drama">Romantic Drama</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description"> Movie Description </label>
                        <textarea required type="text" id="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="rating"> Movie Rating </label>
                        <select required type="text" id="rating" class="form-control">
                            <option disabled selected hidden>Select Rating</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>

                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm btn-sec" id="submitBtn"> Add Movie</button>
                    <button type="button" class="btn btn-sm btn-sec d-none" id="updateBtn"> Update Movie</button>
                    <button type="button" class="btn btn-sm btn-pri closeModel"> Close</button>
                </div>
            </div>
        </form>
    </div>
    <div class="backDrop closeModel" id="backDrop"></div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-danger" role="status">
